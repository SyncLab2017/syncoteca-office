coordinate_request:
  description: >
    Проанализируй входящий запрос: {request}

    Определи:
    1. Тип запроса (licensing / content / legal / financial / biz-dev / technical)
    2. Приоритет (срочный / обычный)
    3. Каких специалистов нужно привлечь и в каком порядке
    4. Ключевые данные для передачи каждому специалисту

    Составь чёткий план с задачами для каждого агента.
  expected_output: >
    Структурированный план с:
    - Классификацией запроса
    - Списком задач для каждого агента
    - Приоритетом и сроками
    - Ключевыми данными для передачи

find_rights_holders:
  description: >
    Для трека: {track_info}

    1. Сначала используй инструмент database с action='search_works', query=<название трека>
       чтобы проверить, есть ли этот трек в нашей базе (310 договоров, 460 произведений).
    2. Если найден — извлеки данные о правообладателе (licensor_name, music_authors, performer)
       и используй action='get_contract' чтобы получить полные условия.
    3. Если не найден в базе — используй search_rights_holders для поиска в интернете.
    4. Определи: автора(ов), паблишера, лейбл / мастер-правообладателя.
    5. Подготовь сводку: sync rights holder + master rights holder + контакты.

  expected_output: >
    Сводка по правообладателям:
    - Статус в базе SYNC LAB (найден / не найден, номер договора если есть)
    - Автор(ы) и их контакты
    - Паблишер (sync rights) + контакт для лицензирования
    - Лейбл / мастер-правообладатель + контакт
    - Территория действия прав
    - Прецеденты из нашей базы (похожие сделки, цены)
    - Рекомендуемый порядок обращения

draft_licensing_email:
  description: >
    Напиши письмо правообладателю для получения sync-лицензии.

    Проект: {project_details}
    Правообладатель: {rights_holder}
    Язык: {language}

    Письмо должно содержать:
    - Представление агентства SYNC LAB
    - Описание проекта (тип медиа, бюджет, территория, срок)
    - Конкретный запрос: sync license / master license / оба
    - Временные рамки
    - Контакт для ответа

  expected_output: >
    Готовое письмо для отправки правообладателю на указанном языке.
    Профессиональный тон, конкретные детали, чёткий call-to-action.

process_track_metadata:
  description: >
    Обработай метаданные трека и добавь в каталог.

    Данные трека: {track_data}

    Заполни все поля:
    - Основные: исполнитель, название, альбом, год
    - Технические: BPM, тональность, длительность, формат
    - Теги: жанр, настроение (mood), инструментовка, темп
    - Лицензионные: ISRC, ISWC, правообладатель, территория
    - Версии: vocal, instrumental, stems доступность

  expected_output: >
    Полная карточка трека в JSON-формате, готовая для загрузки в базу данных.
    Все поля заполнены по стандартам DDEX/ISRC.

calculate_royalties:
  description: >
    Рассчитай роялти по сделке:

    Данные сделки: {deal_data}

    1. Используй database с action='stats_contracts' для понимания типичных цен в нашей базе.
    2. Если известен тип проекта — используй action='list_contracts', query=<тип>
       чтобы найти аналогичные сделки и сравнить стоимость.
    3. Рассчитай роялти используя royalty_calculator.
    4. Включи:
       - Разбивку по правообладателям (автор / паблишер / лейбл)
       - Сумму агентской комиссии SYNC LAB
       - НДС (0% international / 20% внутренний)
       - Сравнение с историческими ценами из базы
       - Формирование счёта / акта

  expected_output: >
    Финансовый расчёт с разбивкой по получателям.
    Сравнение с историческими ценами из базы SYNC LAB.
    Готовый счёт (invoice) и акт для подписания.
    Отчёт для передачи правообладателям.

review_contract:
  description: >
    Проверь договор на юридические риски.

    Договор: {contract_text}

    Проанализируй:
    1. Territory — чётко ограничена или "worldwide"?
    2. Term — ограничен или "in perpetuity"?
    3. Media — перечислены ли все медиа или "all media"?
    4. Exclusivity — есть ли и обоснована ли?
    5. Fee structure — фиксированная / % / per-use?
    6. Moral rights — защищены ли?
    7. Сублицензирование — разрешено ли и на каких условиях?
    8. Расторжение — порядок и условия

  expected_output: >
    Юридический анализ договора:
    - Красные флаги (критические риски)
    - Жёлтые флаги (требуют уточнения)
    - Рекомендации по правкам
    - Оценка: принять / отклонить / скорректировать

draft_license_agreement:
  description: >
    Подготовь лицензионное соглашение.

    Параметры: {license_params}

    Тип: {license_type} (sync / master / sub-publishing)

    Обязательные разделы:
    - Стороны договора
    - Предмет (трек, описание)
    - Территория
    - Срок
    - Медиа и способы использования
    - Вознаграждение
    - Исключительность
    - Гарантии правообладателя
    - Порядок расторжения
    - Применимое право

  expected_output: >
    Готовый текст лицензионного соглашения.
    Соответствует требованиям ГК РФ и/или международным стандартам.

pitch_to_supervisor:
  description: >
    Напиши питч music supervisor / агентству / бренду.

    Получатель: {recipient_info}
    Язык: {language}
    Проект клиента: {client_project} (если известен)

    Питч должен включать:
    - Краткое представление SYNC LAB
    - Что предлагаем (каталог, жанры, особенности)
    - Почему это подходит именно этому получателю
    - Условия работы (licensing speed, stem delivery, exclusivity)
    - Призыв к действию

  expected_output: >
    Готовый питч-email на указанном языке.
    Лаконичный (до 250 слов), профессиональный, персонализированный.

design_database_schema:
  description: >
    Спроектируй или улучши схему базы данных для задачи:

    Задача: {task_description}

    Учти стандарты:
    - ISRC (International Standard Recording Code)
    - ISWC (International Standard Musical Work Code)
    - DDEX (Digital Data Exchange)
    - CWR 3.0 (Common Works Registration)

    Текущая схема (если есть): {current_schema}

  expected_output: >
    SQL-схема (PostgreSQL) с комментариями.
    Индексы для поиска по BPM, настроению, жанру, правообладателю.
    Описание интеграционных точек с РАО / ВОИС / sync-платформами.
