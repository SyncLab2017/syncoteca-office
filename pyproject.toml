[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncoteca"
version = "0.1.0"
description = "Синкотека — Multi-Agent Music Sync Licensing Office"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.20.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "supabase>=2.3.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "mutagen>=1.47.0",
    "pandas>=2.2.0",
    "python-telegram-bot>=22.0",
    "openai>=1.30.0",
    "pydub>=0.25.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
syncoteca = "syncoteca.main:run"
syncoteca-bot = "syncoteca.bot:run_bot"
syncoteca-office = "syncoteca.office_server:run_office"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
